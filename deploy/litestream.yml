# Litestream: continuous SQLite replication to S3 so the ground-truth DB +
# track record survive host loss. install.sh renders the ${...} placeholders to
# concrete values. On AWS, credentials come from the EC2 IAM instance role (no
# static keys); region from AWS_REGION. Docs: https://litestream.io
dbs:
  - path: /opt/hl-bot/data/hlbot.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH}
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the environment.
        retention: 168h          # keep 7d of restore points
        snapshot-interval: 1h
  # Paper forward-test book (hlbot-paper-tick.timer): losing it resets every
  # promotion candidate's 30d G1 calendar clock, so it replicates too.
  - path: /opt/hl-bot/data/hlbot_paper.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH}-paper
        retention: 168h
        snapshot-interval: 1h
