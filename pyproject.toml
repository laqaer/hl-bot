[project]
name = "hl-bot"
version = "0.1.0"
description = "Hyperliquid multi-agent trading bot with goal tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hyperliquid-python-sdk>=0.18.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
hlbot = "hl_bot.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0.3.260530",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
# The Hyperliquid SDK ships no type stubs / py.typed marker.
module = "hyperliquid.*"
ignore_missing_imports = true
