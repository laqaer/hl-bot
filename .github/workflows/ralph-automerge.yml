# CI for the ralph loop's branches (claude/ralph-auto*). GitHub runs this file
# from the PUSHED branch, which the autonomous loop controls — so it is
# UNPRIVILEGED (contents: read) and only lints + tests. The actual gate and
# merge to main live in ralph-trusted-merge.yml, which GitHub always executes
# from main's copy (workflow_run semantics), so the loop cannot weaken or
# delete the gate. Merge privileges must never return to this file: the loop's
# branch copy once dropped the trusted path check, and only a shallow-clone
# failure kept that from landing on main.
name: ralph-automerge
on:
  push:
    branches: ['claude/ralph-auto', 'claude/ralph-auto/**']

permissions:
  contents: read

jobs:
  branch-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
