# Nightly sweep: single-name funding carry (hold-to-collect, maker entries).
agent: funding_carry_v1
interval: 1h
days: 180
prefer: maker
universes:
  - [BTC, ETH, SOL, HYPE]
  - [BTC, ETH, SOL, HYPE, DOGE, XRP]
grid:
  # Recalibrated to HL's baseline-dominated regime (2026-06-13): enter
  # above the 11% APR baseline to catch spikes, exit near it.
  funding_enter_per_hr: [0.00002, 0.00003, 0.00005]
  funding_exit_per_hr: [0.00001, 0.000015]
