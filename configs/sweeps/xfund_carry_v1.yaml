# Nightly sweep: cross-sectional funding carry — the highest-conviction class.
# Question being answered: which entry threshold / breadth / universe clears
# the G0 gate with maker execution on real history?
agent: xfund_carry_v1
interval: 1h
days: 180
prefer: maker
universes:
  - [BTC, ETH, SOL, HYPE]
  - [BTC, ETH, SOL, HYPE, DOGE, XRP]
  - [BTC, ETH, SOL, HYPE, DOGE, XRP, WIF, kPEPE]
grid:
  # Recalibrated 2026-06-13 to the actual funding distribution (most coins
  # pinned at the ~11% APR baseline; xfund is structurally weak here —
  # spot-perp carry (S4) is the better expression — but sweep it honestly).
  enter_funding_per_hr: [0.00002, 0.00003, 0.00005]
  exit_funding_per_hr: [0.00001, 0.000015]
  top_k: [2, 3]
