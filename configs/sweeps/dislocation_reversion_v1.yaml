# Nightly sweep: dislocation reversion — fade volatility-normalized overshoots
# on fine (5m) candles. prefer: TAKER — the honest execution for reversion
# (maker-resting has adverse selection: fills on continuation, misses
# reverting fills). The earlier maker sweep (+7bps) assumed 100% fills at mid,
# an upper bound; this tests whether the edge survives real entry cost.
# Grid keys MUST match the DislocationReversionConfig dataclass field names.
agent: dislocation_reversion_v1
interval: 5m
days: 90
prefer: taker
universes:
  - [BTC, ETH, SOL, HYPE]
  - [BTC, ETH, SOL, HYPE, DOGE, XRP, WIF, kPEPE]
grid:
  z_enter: [2.5, 3.0, 4.0]
  stop_pct: [0.01, 0.02]
  max_hold_bars: [6, 12, 24]
