agent: femr_v1
description: Funding Extremes Mean Reversion — fade extreme 1h funding.
mode: paper
roster: live

# Per-agent metrics only (net_pnl / edge_bps / n_trades); FEMR runs at very small
# notional ($20/trade), so loss limits are tight.
goals:
  primary:
    metric: edge_bps
    window: 7d
    op: ">="
    threshold: 0
  secondary:
    - {metric: net_pnl, window: 30d, op: ">=", threshold: 0}

guardrails:
  - {metric: net_pnl,  window: 24h, op: ">=", threshold: -10,
     action: pause,  reason: "24h realized loss > $10"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -15,
     action: alert, reason: "7d realized edge < -15 bps after costs"}
  - {metric: edge_bps, window: 24h, op: ">=", threshold: -50,
     action: alert,  reason: "24h edge < -50 bps"}

# Auto-promotion ladder: paper -> live_small on simulated (paper-source)
# evidence + a fresh G0 confirmation on real history; live_small -> live ONLY
# on real-fill evidence. The supervisor flips agent_state automatically; the
# kill switch (`hlbot kill`) suppresses all promotions.
sizing:
  live_small_max_total: 75
  live_small_max_per_trade: 25

# n_trades counts CLOSE events (round trips), not fills, since 2026-06-12.
promotion_ladder:
  - from: paper
    to: live_small
    min_days_in_mode: 5
    require_g0: true
    conditions:
      # recent-window risk gate: don't promote an agent that's bleeding NOW
      - {metric: net_pnl,  window: 7d,  op: ">=", threshold: 0, source: paper}
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3, source: paper}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 50, source: paper}
  - from: live_small
    to: live
    min_days_in_mode: 14
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3}
      - {metric: net_pnl,  window: 30d, op: ">=", threshold: 0}
      - {metric: sharpe,   window: 30d, op: ">=", threshold: 1.0}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 20}
