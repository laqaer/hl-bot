agent: twap_mr_regime_v1
description: >-
  TWAP mean-reversion guarded by a trend/regime filter — fades >2-sigma
  deviations only when the local regime is choppy/range, never against a strong
  breakout. The leading G0 candidate; baseline twap_mr bleeds by fading trends.
mode: paper
roster: live

# Per-agent metrics only (sharpe/max_drawdown are account-level). Thresholds sized
# for the small pilot notional. This agent must PROVE it beats baseline on real
# sample before it earns size.
goals:
  primary:
    metric: edge_bps
    window: 7d
    op: ">="
    threshold: 0
  secondary:
    - {metric: net_pnl, window: 30d, op: ">=", threshold: 0}
    - {metric: win_rate, window: 30d, op: ">=", threshold: 0.50}

guardrails:
  - {metric: net_pnl,  window: 24h, op: ">=", threshold: -30,
     action: pause,  reason: "24h realized loss > $30"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -10,
     action: demote, reason: "7d realized edge < -10 bps after costs"}
  - {metric: edge_bps, window: 24h, op: ">=", threshold: -40,
     action: alert,  reason: "24h edge < -40 bps"}

# Auto-promotion ladder: paper -> live_small on simulated (paper-source)
# evidence + a fresh G0 confirmation on real history; live_small -> live ONLY
# on real-fill evidence. The supervisor flips agent_state automatically; the
# kill switch (`hlbot kill`) suppresses all promotions.
sizing:
  live_small_max_total: 75
  live_small_max_per_trade: 25

promotion_ladder:
  - from: paper
    to: live_small
    min_days_in_mode: 5
    require_g0: true
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3, source: paper}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 150, source: paper}
  - from: live_small
    to: live
    min_days_in_mode: 14
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3}
      - {metric: net_pnl,  window: 30d, op: ">=", threshold: 0}
      - {metric: sharpe,   window: 30d, op: ">=", threshold: 1.0}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 40}
