agent: dislocation_reversion_v1
description: >-
  Dislocation reversion — fades the observable EFFECT of forced flow (liquidation
  cascades / stop runs) without a liquidation feed. When mid gaps far from its
  short-window VWAP on a 5m candle (|z| >= z_enter), fade the extreme with a
  maker-resting entry, tight stop, and short hold. Rebuilds the dead liq_cascade
  thesis as a perp-only, live-executable strategy.
mode: paper
roster: live  # perp execution works; require_g0 gates it from reaching live until it confirms on real history

# Per-agent metrics only (sharpe/max_drawdown are account-level). Edge-per-event
# is large (100-300bps), so this must clear costs + a real stop on real sample
# before it earns size.
goals:
  primary:
    metric: edge_bps
    window: 7d
    op: ">="
    threshold: 0
  secondary:
    - {metric: net_pnl, window: 30d, op: ">=", threshold: 0}
    - {metric: win_rate, window: 30d, op: ">=", threshold: 0.50}

guardrails:
  - {metric: net_pnl,  window: 24h, op: ">=", threshold: -20,
     action: pause,  reason: "24h realized loss > $20"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -10,
     action: demote, reason: "7d realized edge < -10 bps after costs"}
  - {metric: edge_bps, window: 24h, op: ">=", threshold: -40,
     action: alert,  reason: "24h edge < -40 bps"}

sizing:
  live_small_max_total: 75
  live_small_max_per_trade: 25

# n_trades counts CLOSE events (round trips), not fills.
promotion_ladder:
  - from: paper
    to: live_small
    min_days_in_mode: 5
    require_g0: true
    persist_days: 3
    persist_evals: 12
    conditions:
      # recent-window risk gate: don't promote an agent that's bleeding NOW
      - {metric: net_pnl,  window: 7d,  op: ">=", threshold: 0, source: paper}
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3, source: paper}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 20, source: paper}
  - from: live_small
    to: live
    min_days_in_mode: 14
    persist_days: 3
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3,   source: live}
      - {metric: net_pnl,  window: 30d, op: ">=", threshold: 0,   source: live}
      - {metric: sharpe,   window: 30d, op: ">=", threshold: 1.0, source: live}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 10,  source: live}
