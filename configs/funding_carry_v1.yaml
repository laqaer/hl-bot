agent: funding_carry_v1
description: >-
  Single-name maker funding carry — enter the carry-collecting side on extreme
  funding and HOLD to collect (no take-profit churn), exit on normalization /
  wide stop / max-hold. The fixed-economics replacement for taker FEMR. Must pass
  the G0 confirmation gate on real history before live wiring.
mode: paper
roster: live

goals:
  primary:
    metric: edge_bps
    window: 7d
    op: ">="
    threshold: 0
  secondary:
    - {metric: net_pnl, window: 30d, op: ">=", threshold: 0}

guardrails:
  - {metric: net_pnl,  window: 24h, op: ">=", threshold: -20,
     action: pause,  reason: "24h realized loss > $20"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -10,
     action: demote, reason: "7d realized edge < -10 bps after costs"}

# Auto-promotion ladder: paper -> live_small on simulated (paper-source)
# evidence + a fresh G0 confirmation on real history; live_small -> live ONLY
# on real-fill evidence. The supervisor flips agent_state automatically; the
# kill switch (`hlbot kill`) suppresses all promotions.
sizing:
  live_small_max_total: 75
  live_small_max_per_trade: 25

promotion_ladder:
  - from: paper
    to: live_small
    min_days_in_mode: 10
    require_g0: true
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3, source: paper}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 60, source: paper}
  - from: live_small
    to: live
    min_days_in_mode: 21
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3}
      - {metric: net_pnl,  window: 30d, op: ">=", threshold: 0}
      - {metric: sharpe,   window: 30d, op: ">=", threshold: 1.0}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 40}
