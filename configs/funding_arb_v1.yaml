agent: funding_arb_v1
description: Collect funding when 1h rate exits the band.
mode: paper

goals:
  primary:
    metric: sharpe
    window: 30d
    op: ">="
    threshold: 1.5
  secondary:
    - {metric: net_pnl,  window: 30d, op: ">=", threshold: 500}
    - {metric: win_rate, window: 30d, op: ">=", threshold: 0.55}

# max_drawdown/calmar are account-only (need a capital base); for a real agent
# they are always N/A, so a max_drawdown guardrail could never fire. Demote keys
# off the per-agent-computable edge_bps instead, consistent with the carry configs.
guardrails:
  - {metric: net_pnl,  window: 24h, op: ">=", threshold: -200,
     action: pause,  reason: "24h loss limit -$200"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -10,
     action: demote, reason: "7d realized edge < -10 bps after costs"}
  # Dollar peak-to-trough give-back over 7d (max_drawdown_usd is ≤ 0 and needs no
  # capital base, so it IS computable for a real agent — unlike fractional
  # max_drawdown). Catches a run-up-then-bleed even when net/edge stay positive.
  - {metric: max_drawdown_usd, window: 7d, op: ">=", threshold: -400,
     action: demote, reason: "7d give-back exceeds $400"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -5,
     action: alert,  reason: "edge_bps < -5 after costs"}

promotion:
  from: paper
  to: live_small
  conditions:
    - {metric: sharpe,   window: 30d, op: ">=", threshold: 2.0}
    - {metric: n_trades, window: 30d, op: ">=", threshold: 100}
    - {metric: edge_bps, window: 30d, op: ">=", threshold: 3}
