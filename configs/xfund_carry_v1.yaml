agent: xfund_carry_v1
description: >-
  Market-neutral cross-sectional funding carry — short the top-K highest-funding
  coins, long the bottom-K most-negative, dollar-neutral, collect the funding
  spread. Highest-conviction candidate (low directional variance, scalable,
  capital/AUM-friendly). Must pass the G0 confirmation gate on real history
  before it is wired into the live roster.
mode: paper
roster: live

goals:
  primary:
    metric: edge_bps
    window: 7d
    op: ">="
    threshold: 0
  secondary:
    - {metric: net_pnl, window: 30d, op: ">=", threshold: 0}

guardrails:
  - {metric: net_pnl,  window: 24h, op: ">=", threshold: -30,
     action: pause,  reason: "24h realized loss > $30"}
  - {metric: edge_bps, window: 7d,  op: ">=", threshold: -10,
     action: demote, reason: "7d realized edge < -10 bps after costs"}

# Auto-promotion ladder: paper -> live_small on simulated (paper-source)
# evidence + a fresh G0 confirmation on real history; live_small -> live ONLY
# on real-fill evidence. The supervisor flips agent_state automatically; the
# kill switch (`hlbot kill`) suppresses all promotions.
sizing:
  live_small_max_total: 75
  live_small_max_per_trade: 25

# n_trades counts CLOSE events (round trips), not fills, since 2026-06-12.
promotion_ladder:
  - from: paper
    to: live_small
    min_days_in_mode: 5
    require_g0: true
    conditions:
      # recent-window risk gate: don't promote an agent that's bleeding NOW
      - {metric: net_pnl,  window: 7d,  op: ">=", threshold: 0, source: paper}
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3, source: paper}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 20, source: paper}
  - from: live_small
    to: live
    min_days_in_mode: 14
    conditions:
      - {metric: edge_bps, window: 30d, op: ">=", threshold: 3}
      - {metric: net_pnl,  window: 30d, op: ">=", threshold: 0}
      - {metric: sharpe,   window: 30d, op: ">=", threshold: 1.0}
      - {metric: n_trades, window: 30d, op: ">=", threshold: 20}
